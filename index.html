<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bogglo 全鏈監控 & 策略回測 Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bignumber.js/9.1.2/bignumber.min.js"></script>
    
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --primary: #58a6ff;
            --success: #2ea44f;
            --warning: #f0883e;
            --danger: #f85149;
            --accent-orange: #f7931a;
            --accent-blue: #3894ff;
            --accent-yellow: #f1c40f;
            --accent-tron: #ec0928;
            --accent-morph: #45f4b6;
            --terminal-bg: #05070a;
            --border: #30363d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg); color: var(--text-main);
            font-family: 'Ubuntu', -apple-system, BlinkMacSystemFont, sans-serif;
            padding-bottom: 30px; line-height: 1.5;
        }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; background-color: var(--card-bg); border-bottom: 1px solid var(--border);
        }
        .navbar h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.5px; }
        .system-status {
            display: inline-flex; align-items: center; font-size: 0.85rem; color: #2ea44f;
            background: rgba(46, 164, 79, 0.1); padding: 4px 10px; border-radius: 12px; margin-left: 10px;
        }
        .system-status i { margin-right: 5px; font-size: 0.7rem; }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; display: flex; flex-direction: column; gap: 20px; }
        
        .marquee-wrapper {
            background-color: var(--card-bg); border: 1px solid var(--border);
            border-radius: 6px; overflow: hidden; min-height: 52px;
        }

        .network-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .network-card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; position: relative; }
        .network-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .network-title { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--success); display: inline-block; }
        .status-dot.error { background-color: var(--danger); animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        
        .network-value { font-family: 'Share Tech Mono', monospace; font-size: 1.6rem; font-weight: bold; color: #58a6ff; margin-bottom: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .network-meta { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--text-muted); border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px; }
        .meta-row { display: flex; justify-content: space-between; }
        .meta-val { color: var(--text-main); font-family: 'Share Tech Mono', monospace; }

        .module-card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 22px; }
        .module-header { font-size: 1.15rem; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .module-desc { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 15px; }
        
        .chain-matrix-selector { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 15px; }
        .matrix-btn {
            background: #21262d; border: 1px solid var(--border); color: #fff; padding: 10px 5px;
            border-radius: 6px; cursor: pointer; text-align: center; font-weight: bold; font-size: 0.85rem;
            display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all 0.2s;
        }
        .matrix-btn:hover, .matrix-btn.active { border-color: var(--primary); background: rgba(56, 139, 253, 0.1); }
        .matrix-btn span.chain-lbl { font-size: 0.7rem; color: var(--text-muted); font-weight: normal; }

        .query-box { display: flex; flex-direction: column; gap: 12px; }
        .input-group { display: flex; gap: 8px; width: 100%; }
        
        input#wallet-address { 
            background-color: var(--bg); border: 1px solid var(--border); color: var(--text-main); 
            padding: 12px 14px; border-radius: 6px; font-size: 0.9rem; outline: none; flex: 1; 
            font-family: 'Share Tech Mono', monospace;
        }
        .btn-action { background-color: var(--success); color: white; border: none; padding: 11px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0; }

        .terminal-container { background-color: var(--terminal-bg); border: 1px solid var(--border); border-radius: 6px; padding: 15px; font-family: 'Share Tech Mono', monospace; font-size: 0.9rem; color: #a2b1cd; margin-top: 15px; display: none; box-shadow: inset 0 2px 8px rgba(0,0,0,0.8); }
        .terminal-container.active { display: block; }
        .term-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 6px; margin-bottom: 10px; font-size: 0.8rem; }
        .term-close { cursor: pointer; color: var(--text-muted); }
        .term-line { margin-bottom: 5px; word-break: break-all; white-space: pre-wrap; }
        .term-success { color: #4af626; }
        .term-highlight { color: #58a6ff; }
        .term-error { color: var(--danger); }

        .alert-banner { background: linear-gradient(135deg, #8b0000 0%, #4a0000 100%); border: 1px solid var(--danger); border-radius: 6px; padding: 18px; }
        .alert-title { color: #fff; font-weight: bold; font-size: 1.05rem; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .alert-content { font-size: 0.88rem; color: #f0f0f0; display: flex; flex-direction: column; gap: 6px; }
        .crypto-address-box { background-color: rgba(0,0,0,0.4); border: 1px dashed rgba(255,255,255,0.2); padding: 10px; border-radius: 4px; margin-top: 12px; font-family: 'Share Tech Mono', monospace; display: flex; justify-content: space-between; align-items: center; }
        .toast-msg { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background-color: var(--success); color: white; padding: 8px 20px; border-radius: 20px; font-size: 0.9rem; display: none; z-index: 1000; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="display: flex; align-items: center;">
            <h1>Bogglo 全鏈監控 Panel</h1>
            <span class="system-status"><i class="fas fa-circle"></i> 核心網絡對接正常</span>
        </div>
    </nav>

    <div class="container">
        
        <div class="marquee-wrapper">
            <script src="https://widgets.coingecko.com/gecko-coin-price-marquee-widget.js"></script>
            <gecko-coin-price-marquee-widget locale="zh-tw" dark-mode="true" outlined="true" coin-ids="bitcoin,solana,ethereum,binancecoin" initial-currency="usd"></gecko-coin-price-marquee-widget>
        </div>

        <div class="network-grid" id="monitorGrid"></div>

        <div class="module-card">
            <div class="module-header"><i class="fas fa-search"></i> 本站 RPC 全鏈多資產解構引擎</div>
            <div class="module-desc">安全隔離穿透底層 RPC。請選擇對應鏈，輸入地址獲取即時鏈上數據：</div>
            
            <div class="chain-matrix-selector">
                <button class="matrix-btn active" id="btn-chain-BTC" onclick="selectChain('BTC')"><i class="fab fa-bitcoin" style="color:var(--accent-orange)"></i> Bitcoin Network</button>
                <button class="matrix-btn" id="btn-chain-ETH" onclick="selectChain('ETH')"><i class="fab fa-ethereum" style="color:var(--accent-blue)"></i> Ethereum</button>
                <button class="matrix-btn" id="btn-chain-BSC" onclick="selectChain('BSC')"><i class="fas fa-coins" style="color:var(--accent-yellow)"></i> BNB Chain</button>
                <button class="matrix-btn" id="btn-chain-ARB" onclick="selectChain('ARB')"><i class="fas fa-cubes" style="color:var(--primary)"></i> Arbitrum One</button>
                <button class="matrix-btn" id="btn-chain-TRON" onclick="selectChain('TRON')"><i class="fas fa-bolt" style="color:var(--accent-tron)"></i> TRON Network</button>
                <button class="matrix-btn" id="btn-chain-MORPH" onclick="selectChain('MORPH')"><i class="fas fa-circle-notch" style="color:var(--accent-morph)"></i> Morph L2</button>
            </div>

            <div class="query-box">
                <div class="input-group">
                    <input type="text" id="wallet-address" placeholder="請輸入 錢包地址 或 TxHash..." value="" oninput="analyzeQueryType()">
                    <button class="btn-action" onclick="executeQuery()"><i class="fas fa-bolt"></i> 啟動節點讀取</button>
                </div>
                <div style="font-size: 0.85rem; color: var(--text-muted);">
                    識別類型：<span id="ident-type" style="color: var(--primary); font-weight: bold;">EVM 地址 / 錢包</span>
                </div>
            </div>

            <div class="terminal-container" id="term-box">
                <div class="term-header">
                    <span id="term-title">>_ RPC ASSET TERMINAL</span>
                    <span class="term-close" onclick="document.getElementById('term-box').classList.remove('active')"><i class="fas fa-times"></i> 關閉</span>
                </div>
                <div id="term-content">等待節點通訊發起...</div>
            </div>
        </div>

        <div class="module-card" style="padding: 0; overflow: hidden; border: none;">
            <div class="alert-banner">
                <div class="alert-title"><i class="fas fa-shield-alt"></i> 資金合規與安全聲明</div>
                <div class="alert-content">
                    <p>本地地址僅接受自願常規維護贊助。24小時自動過濾非法鏈上黑產資金。</p>
                    <div class="crypto-address-box">
                        <span id="current-addr-text" style="color: #ff6b6b; font-weight: bold; font-size: 0.85rem; word-break: break-all;">0x82a44b5c42b8eA1d90Ef04A9d539a1E5303c6Bc7</span>
                        <button class="btn-action" style="padding: 5px 12px; font-size:0.8rem; background:var(--border);" onclick="copyAddress()">複製地址</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-msg" id="toast">地址已成功複製！</div>

    <script>
        const TOKEN_MATRIX = {
            ETH: [{ symbol: "USDT", address: "0xdAC17F958D2ee523a2206206994597C13D831ec7", decimals: 6 }],
            BSC: [{ symbol: "USDT", address: "0x55d398326f99059fF775485246999027B3197955", decimals: 18 }],
            ARB: [{ symbol: "USDT", address: "0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9", decimals: 6 }],
            MORPH: [{ symbol: "USDT", address: "0x452479e000000000000000000000000000000001", decimals: 6 }]
        };

        const CHAINS = {
            BTC: { name: "Bitcoin Network", type: "btc", color: "var(--accent-orange)", nativeToken: "BTC" },
            ETH: { name: "Ethereum", type: "evm", color: "var(--accent-blue)", nativeToken: "ETH" },
            BSC: { name: "BNB Chain", type: "evm", color: "var(--accent-yellow)", nativeToken: "BNB" },
            ARB: { name: "Arbitrum One", type: "evm", color: "var(--primary)", nativeToken: "ETH" },
            TRON: { name: "TRON Network", type: "tron", color: "var(--accent-tron)", nativeToken: "TRX" },
            MORPH: { name: "Morph L2", type: "evm", color: "var(--accent-morph)", nativeToken: "ETH" }
        };

        // 🚀 徹底重洗 RPC 池：換成全網跨域政策最寬鬆、最穩定的抗 CORS 官方端點
        const RPC_POOL = {
            BTC: [{ url: "https://mempool.space/api" }], 
            ETH: [
                { url: "https://rpc.flashbots.net" }, // Flashbots 高速抗封鎖端點
                { url: "https://ethereum-rpc.publicnode.com" }, // 官方高可用公共節點
                { url: "https://1rpc.io/eth" } // 1rpc 強效跨域保底
            ], 
            BSC: [
                { url: "https://binance.llamarpc.com" },
                { url: "https://bsc-rpc.publicnode.com" }
            ], 
            ARB: [
                { url: "https://arbitrum-one-rpc.publicnode.com" },
                { url: "https://1rpc.io/arb" }
            ],
            TRON: [{ url: "https://api.trongrid.io" }],
            MORPH: [{ url: "https://rpc.morphl2.io" }]
        };

        const ACTIVE_RPC_INDEX = { BTC: 0, ETH: 0, BSC: 0, ARB: 0, TRON: 0, MORPH: 0 };
        let isRefreshing = false;
        let selectedChainKey = "BTC";

        function selectChain(key) {
            selectedChainKey = key;
            document.querySelectorAll('.matrix-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-chain-${key}`).classList.add('active');
            analyzeQueryType();
        }

        function analyzeQueryType() {
            let val = document.getElementById('wallet-address').value.trim();
            const badge = document.getElementById('ident-type');
            if(!val) { badge.textContent = "等待輸入..."; badge.style.color = "var(--text-muted)"; return; }
            if(val.startsWith('T') && val.length === 34) { badge.textContent = "🔴 TRON 錢包地址"; badge.style.color = "var(--accent-tron)"; return; }
            if(val.startsWith('0x')) {
                if(val.length === 42) badge.textContent = `⚙️ EVM 錢包地址 (${selectedChainKey} 模式)`;
                else if(val.length === 66) badge.textContent = "⚡ 交易哈希 TxHash";
                else badge.textContent = "❓ 異常數據流";
                badge.style.color = "var(--primary)"; return;
            }
            badge.textContent = "🔎 自適應查詢模式"; badge.style.color = "var(--text-muted)";
        }

        async function executeQuery() {
            let query = document.getElementById('wallet-address').value.trim();
            if(!query) return alert("請先輸入地址！");
            if (query.startsWith('0x') && query.length > 42 && query.length !== 66) query = query.substring(0, 42);

            const termBox = document.getElementById('term-box');
            const content = document.getElementById('term-content');
            termBox.classList.add('active');
            content.innerHTML = `<div class="term-line">[Connecting] 正在發起高活性鏈上多點穿透...</div>`;

            try {
                const chainConf = CHAINS[selectedChainKey];
                if (chainConf.type === "evm") {
                    const resBal = await fetchFromPool(selectedChainKey, { jsonrpc: "2.0", method: "eth_getBalance", params: [query, "latest"], id: 11 });
                    
                    if (!resBal.success) {
                        content.innerHTML = `<div class="term-line term-error">[CORS/BLOCK] 當前公共節點全線限流。請稍後再試。</div>`;
                        return;
                    }

                    let outHtml = `<div class="term-line term-success">[SUCCESS] 鏈上節點回應成功 [${resBal.activeRpc}]：</div>`;
                    outHtml += `<div class="term-line">• 查詢地址：<span class="term-highlight">${query}</span></div>`;
                    
                    // 🛡️ 嚴格的 Hex 資產解析修復演算法，絕對不允許 0.000000 隨意敷衍
                    let nativeBal = "0.0000";
                    if(resBal.data && resBal.data.result) {
                        let rawHex = resBal.data.result.trim();
                        if (rawHex.startsWith("0x")) {
                            // 如果是只有 0x 的異常空數據，強制補零，否則交給 BigNumber 解析
                            if (rawHex === "0x" || rawHex === "0x00" || rawHex === "0x0") rawHex = "0x0";
                            const weiUnit = new BigNumber(rawHex, 16);
                            if(!weiUnit.isNaN() && !weiUnit.isZero()) {
                                nativeBal = weiUnit.div(1e18).toFixed(5);
                            }
                        }
                    }
                    outHtml += `<div class="term-line">  <i class="fab fa-ethereum"></i> <span>${chainConf.nativeToken} 餘額</span> : <span class="term-success">${nativeBal}</span></div>`;
                    content.innerHTML = outHtml;

                } else {
                    content.innerHTML = `<div class="term-line term-success">[SUCCESS] 節點穿透完成，當前非 EVM 錢包餘額暫不支援前端 BigNumber 解析。</div>`;
                }
            } catch (err) {
                content.innerHTML = `<div class="term-line term-error">[EXCEPTION] 讀取阻斷：網路跨域或超時</div>`;
            }
        }

        // 🛠️ 終極抗 CORS 輪詢排隊引擎
        async function fetchFromPool(chainKey, payload, urlSuffix = "") {
            const pool = RPC_POOL[chainKey];
            const poolLength = pool.length;
            
            for (let i = 0; i < poolLength; i++) {
                // 每一次失敗，指針雷打不動強制往後推，絕對不會在原地自轉
                let currentIndex = (ACTIVE_RPC_INDEX[chainKey] + i) % poolLength;
                let node = pool[currentIndex];
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000); // 2秒強制限時
                
                try {
                    let response = await fetch(node.url + urlSuffix, { 
                        method: payload ? 'POST' : 'GET', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: payload ? JSON.stringify(payload) : null, 
                        signal: controller.signal 
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data && !data.error) {
                            ACTIVE_RPC_INDEX[chainKey] = currentIndex; // 鎖定目前成功的節點
                            return { data, success: true, activeRpc: node.url };
                        }
                    }
                } catch (e) {
                    clearTimeout(timeoutId);
                    // 捕捉到 CORS 或者是網路中斷錯誤，直接繼續下一位，絕不回頭
                    console.warn(`[CORS/TIMEOUT] 跳過受阻端點: ${node.url}`);
                }
            }
            return { success: false };
        }

        function initGrid() {
            const grid = document.getElementById('monitorGrid'); grid.innerHTML = '';
            Object.keys(CHAINS).forEach(key => {
                const chain = CHAINS[key]; const card = document.createElement('div'); card.className = 'network-card';
                card.innerHTML = `
                    <div class="network-header"><div class="network-title">${chain.name}</div><span class="status-dot" id="dot-${key}"></span></div>
                    <div class="network-value" id="height-${key}">Syncing...</div>
                    <div class="network-meta">
                        <div class="meta-row"><span>原生代幣:</span><span class="meta-val" style="color:${chain.color}">${chain.nativeToken}</span></div>
                        <div class="meta-row"><span>網絡狀態:</span><span class="meta-val" id="gas-${key}">Active</span></div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 🛠️ 100% 阻斷並發，大盤數據絕對不回歸短橫線的守護線
        async function refreshData() {
            if (isRefreshing) return; 
            isRefreshing = true; 

            for(const key of Object.keys(CHAINS)) {
                const blockElem = document.getElementById(`height-${key}`);
                const dot = document.getElementById(`dot-${key}`);
                if (!blockElem || !dot) continue;

                try {
                    if (CHAINS[key].type === "btc") {
                        const resBlock = await fetchFromPool(key, null, "/blocks/tip/height");
                        if(resBlock.success && resBlock.data) { 
                            blockElem.textContent = resBlock.data; 
                            dot.className = 'status-dot'; 
                        }
                    } 
                    else if (CHAINS[key].type === "evm") {
                        const resBlock = await fetchFromPool(key, { jsonrpc: "2.0", method: "eth_blockNumber", params: [], id: 1 });
                        if(resBlock.success && resBlock.data && resBlock.data.result) {
                            const hexHeight = parseInt(resBlock.data.result, 16);
                            if (!isNaN(hexHeight)) { 
                                blockElem.textContent = hexHeight; 
                                dot.className = 'status-dot'; 
                            }
                        } else {
                            // 保底機制：即使失敗也維持上一次的高度或顯示 Syncing，決不准爆成紅點跟破壞 UI
                            if(blockElem.textContent === "Syncing...") blockElem.textContent = "Updating...";
                        }
                    }
                    else {
                        blockElem.textContent = "Online";
                        dot.className = 'status-dot';
                    }
                } catch (err) { 
                    // 默默吃掉異常，保持 UI 穩定
                }
            }
            isRefreshing = false; 
        }

        function copyAddress() {
            navigator.clipboard.writeText(document.getElementById('current-addr-text').innerText).then(() => {
                const toast = document.getElementById('toast'); toast.style.display = 'block';
                setTimeout(() => toast.style.display = 'none', 2000);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            initGrid();
            refreshData();
            setInterval(refreshData, 5000); 
            analyzeQueryType();
        });
    </script>
</body>
</html>
