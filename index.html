<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bogglo 全鏈監控 Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bignumber.js/9.1.2/bignumber.min.js"></script>
    <script src="https://widgets.coingecko.com/gecko-coin-price-marquee-widget.js"></script>
    <style>
        :root {
            --bg:          #080b10;
            --surface:     #0e1420;
            --surface-2:   #141b28;
            --border:      #1e2d42;
            --border-hi:   #2a3f5c;
            --text:        #cdd9e8;
            --text-muted:  #5a7294;
            --text-dim:    #3a5070;

            --btc:   #f7931a;
            --eth:   #6272ea;
            --bnb:   #f3ba2f;
            --arb:   #28a0f0;
            --tron:  #ec0928;
            --morph: #00e5aa;

            --ok:    #00c97a;
            --warn:  #f59e0b;
            --err:   #f04040;
            --info:  #3d9eff;

            --mono: 'JetBrains Mono', monospace;
            --sans: 'Inter', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* ─── SCANLINE OVERLAY ─── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.06) 2px,
                rgba(0,0,0,0.06) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }

        /* ─── NAVBAR ─── */
        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            height: 56px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-logo {
            font-family: var(--mono);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #fff;
        }
        .nav-logo span { color: var(--info); }
        .nav-badge {
            font-size: 0.72rem;
            font-family: var(--mono);
            color: var(--ok);
            background: rgba(0,201,122,0.1);
            border: 1px solid rgba(0,201,122,0.25);
            padding: 2px 8px;
            border-radius: 3px;
            letter-spacing: 0.05em;
        }
        .nav-badge::before { content: '● '; font-size: 0.6rem; }
        .nav-time {
            font-family: var(--mono);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* ─── MARQUEE ─── */
        .marquee-wrap {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            overflow: hidden;
        }

        /* ─── LAYOUT ─── */
        .container {
            max-width: 1260px;
            margin: 0 auto;
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ─── SECTION LABEL ─── */
        .section-label {
            font-family: var(--mono);
            font-size: 0.72rem;
            letter-spacing: 0.15em;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .section-label::before {
            content: '//  ';
            color: var(--border-hi);
        }

        /* ─── NETWORK GRID ─── */
        .network-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
            gap: 12px;
        }

        .net-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .net-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--accent-color, var(--border));
            opacity: 0.7;
        }
        .net-card:hover { border-color: var(--border-hi); }

        .net-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .net-name {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.04em;
        }
        .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--ok);
            box-shadow: 0 0 6px var(--ok);
        }
        .dot.err {
            background: var(--err);
            box-shadow: 0 0 6px var(--err);
            animation: blink 1.4s infinite;
        }
        @keyframes blink { 50% { opacity: 0.3; } }

        .net-block {
            font-family: var(--mono);
            font-size: 1.45rem;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            margin-bottom: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .net-block.loading {
            color: var(--text-dim);
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse { 50% { opacity: 0.4; } }

        .net-foot {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.75rem;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }
        .net-row {
            display: flex;
            justify-content: space-between;
        }
        .net-row-k { color: var(--text-dim); }
        .net-row-v {
            font-family: var(--mono);
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        /* ─── QUERY MODULE ─── */
        .query-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 24px;
        }
        .query-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .query-title i { color: var(--info); }
        .query-sub {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* chain selector */
        .chain-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
            margin-bottom: 20px;
        }
        .chain-btn {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 12px 8px 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
            position: relative;
            overflow: hidden;
        }
        .chain-btn:hover {
            border-color: var(--border-hi);
            background: #192030;
        }
        .chain-btn.active {
            border-color: var(--c-color, var(--info));
            background: rgba(255,255,255,0.04);
        }
        .chain-btn.active::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--c-color, var(--info));
        }
        .chain-btn .c-icon {
            font-size: 1.2rem;
        }
        .chain-btn .c-name {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text);
        }
        .chain-btn .c-tag {
            font-size: 0.65rem;
            font-family: var(--mono);
            color: var(--text-dim);
        }

        /* input row */
        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .addr-input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.88rem;
            padding: 11px 14px;
            outline: none;
            transition: border-color 0.15s;
        }
        .addr-input:focus { border-color: var(--info); }
        .addr-input::placeholder { color: var(--text-dim); }

        .query-btn {
            background: var(--info);
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 11px 22px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
            transition: opacity 0.15s;
        }
        .query-btn:hover { opacity: 0.85; }
        .query-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .ident-bar {
            font-size: 0.8rem;
            font-family: var(--mono);
            color: var(--text-dim);
            padding: 4px 0;
        }
        .ident-bar span {
            color: var(--info);
            font-weight: 600;
        }

        /* ─── TERMINAL ─── */
        .term {
            display: none;
            margin-top: 20px;
            background: #04070d;
            border: 1px solid var(--border);
            border-radius: 5px;
            overflow: hidden;
        }
        .term.active { display: block; }

        .term-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 14px;
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
        }
        .term-bar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .term-dots {
            display: flex;
            gap: 5px;
        }
        .term-dots span {
            width: 10px; height: 10px;
            border-radius: 50%;
        }
        .term-dots span:nth-child(1) { background: #ff5f57; }
        .term-dots span:nth-child(2) { background: #febc2e; }
        .term-dots span:nth-child(3) { background: #28c840; }
        .term-label {
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .term-close {
            font-size: 0.75rem;
            color: var(--text-dim);
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid transparent;
        }
        .term-close:hover {
            color: var(--err);
            border-color: var(--err);
        }

        .term-body {
            padding: 16px;
            font-family: var(--mono);
            font-size: 0.84rem;
            line-height: 1.85;
            color: #7a9abc;
            max-height: 440px;
            overflow-y: auto;
        }
        .term-body::-webkit-scrollbar { width: 4px; }
        .term-body::-webkit-scrollbar-track { background: transparent; }
        .term-body::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }

        .t-line { word-break: break-all; white-space: pre-wrap; }
        .t-ok   { color: #00c97a; }
        .t-hi   { color: #5ab4ff; }
        .t-warn { color: #f59e0b; }
        .t-err  { color: #f04040; }
        .t-dim  { color: var(--text-dim); }
        .t-sep  {
            border: none;
            border-top: 1px dashed var(--border);
            margin: 10px 0;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 640px) {
            .input-row { flex-direction: column; }
            .query-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<nav class="nav">
    <div class="nav-brand">
        <div class="nav-logo">BOG<span>GLO</span></div>
        <div class="nav-badge">OPERATIONAL</div>
    </div>
    <div class="nav-time" id="nav-clock">--:--:-- UTC</div>
</nav>

<div class="marquee-wrap">
    <gecko-coin-price-marquee-widget
        locale="zh-tw" dark-mode="true" outlined="false"
        coin-ids="bitcoin,ethereum,binancecoin,solana,ripple,tron"
        initial-currency="usd">
    </gecko-coin-price-marquee-widget>
</div>

<div class="container">

    <!-- Network status grid -->
    <div>
        <div class="section-label">鏈網狀態監控</div>
        <div class="network-grid" id="net-grid"></div>
    </div>

    <!-- Query module -->
    <div class="query-card">
        <div class="query-title"><i class="fas fa-terminal"></i> RPC 全鏈資產解構引擎</div>
        <div class="query-sub">直連底層高速 RPC 節點，解析錢包原生資產與合約代幣餘額，或查詢任意交易哈希詳情。</div>

        <div class="section-label" style="margin-bottom:10px">選擇目標鏈</div>
        <div class="chain-grid" id="chain-grid"></div>

        <div class="input-row">
            <input
                class="addr-input"
                id="wallet-input"
                type="text"
                placeholder="錢包地址 或 交易哈希 (TxHash)…"
                oninput="analyzeInput()"
                autocomplete="off"
                spellcheck="false"
            >
            <button class="query-btn" id="exec-btn" onclick="runQuery()">
                <i class="fas fa-bolt"></i> 查詢
            </button>
        </div>
        <div class="ident-bar">識別：<span id="ident-label">等待輸入…</span></div>

        <div class="term" id="term">
            <div class="term-bar">
                <div class="term-bar-left">
                    <div class="term-dots"><span></span><span></span><span></span></div>
                    <div class="term-label" id="term-label">RPC TERMINAL</div>
                </div>
                <div class="term-close" onclick="closeTerm()">✕ 關閉</div>
            </div>
            <div class="term-body" id="term-body">等待指令…</div>
        </div>
    </div>

</div>

<script>
/* ═══════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════ */
const CHAINS = {
    BTC:  { name: "Bitcoin",   type: "btc",  color: "#f7931a", native: "BTC",  gasLabel: "推薦費率",  icon: "fab fa-bitcoin" },
    ETH:  { name: "Ethereum",  type: "evm",  color: "#6272ea", native: "ETH",  gasLabel: "Gas Price", icon: "fab fa-ethereum" },
    BSC:  { name: "BNB Chain", type: "evm",  color: "#f3ba2f", native: "BNB",  gasLabel: "Gas Price", icon: "fas fa-coins" },
    ARB:  { name: "Arbitrum",  type: "evm",  color: "#28a0f0", native: "ETH",  gasLabel: "Gas Price", icon: "fas fa-layer-group" },
    TRON: { name: "TRON",      type: "tron", color: "#ec0928", native: "TRX",  gasLabel: "能量費率",  icon: "fas fa-bolt" },
    MORPH:{ name: "Morph L2",  type: "evm",  color: "#00e5aa", native: "ETH",  gasLabel: "Gas Price", icon: "fas fa-circle-notch" },
};

const RPC = {
    BTC:  [{ url: "https://blockstream.info/api" }, { url: "https://mempool.space/api" }],
    ETH:  [{ url: "https://rpc.flashbots.net" }, { url: "https://ethereum-rpc.publicnode.com" }, { url: "https://web3.mybitkeep.vip" }]
    BSC:  [{ url: "https://binance.llamarpc.com" }, { url: "https://bsc-rpc.publicnode.com" }],
    ARB:  [{ url: "https://arbitrum-one-rpc.publicnode.com" }, { url: "https://arb1.arbitrum.io/rpc" }]
    TRON: [{ url: "https://api.trongrid.io" }],
    MORPH:[{ url: "https://rpc.morphl2.io" }],
};

const TOKENS = {
    ETH:  [{ sym:"USDT", addr:"0xdAC17F958D2ee523a2206206994597C13D831ec7", dec:6 },
           { sym:"USDC", addr:"0xA0b86991c6218b36c1d19D4a2e9Eb0CE3606eB48", dec:6 }],
    BSC:  [{ sym:"USDT", addr:"0x55d398326f99059fF775485246999027B3197955", dec:18},
           { sym:"USDC", addr:"0x8AC76a51cc950d9822D68b83fE1Ad97B32CD580d", dec:18}],
    ARB:  [{ sym:"USDC", addr:"0xaf88d065e77c8cC2239327C5EDb3A432268e5831", dec:6 },
           { sym:"USDT", addr:"0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9", dec:6 }],
    MORPH:[{ sym:"USDT", addr:"0x452479e000000000000000000000000000000001", dec:6 },
           { sym:"USDC", addr:"0x5300000000000000000000000000000000000002", dec:6 }],
};

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let activeChain = "BTC";
let refreshBusy = false;

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
document.addEventListener("DOMContentLoaded", () => {
    buildGrid();
    buildChainBtns();
    selectChain("BTC");
    refreshAll();
    setInterval(refreshAll, 5000);
    setInterval(updateClock, 1000);
    updateClock();
});

function updateClock() {
    const now = new Date();
    document.getElementById("nav-clock").textContent =
        now.toUTCString().split(" ")[4] + " UTC";
}

/* ─── Network grid cards ─── */
function buildGrid() {
    const g = document.getElementById("net-grid");
    g.innerHTML = "";
    Object.entries(CHAINS).forEach(([k, c]) => {
        const card = document.createElement("div");
        card.className = "net-card";
        card.style.setProperty("--accent-color", c.color);
        card.innerHTML = `
            <div class="net-head">
                <div class="net-name">${c.name}</div>
                <div class="dot" id="dot-${k}"></div>
            </div>
            <div class="net-block loading" id="blk-${k}">———</div>
            <div class="net-foot">
                <div class="net-row">
                    <span class="net-row-k">原生代幣</span>
                    <span class="net-row-v" style="color:${c.color}">${c.native}</span>
                </div>
                <div class="net-row">
                    <span class="net-row-k">${c.gasLabel}</span>
                    <span class="net-row-v" id="gas-${k}">—</span>
                </div>
            </div>
        `;
        g.appendChild(card);
    });
}

/* ─── Chain selector buttons ─── */
function buildChainBtns() {
    const g = document.getElementById("chain-grid");
    g.innerHTML = "";
    Object.entries(CHAINS).forEach(([k, c]) => {
        const btn = document.createElement("button");
        btn.className = "chain-btn";
        btn.id = `cbtn-${k}`;
        btn.style.setProperty("--c-color", c.color);
        btn.innerHTML = `
            <i class="${c.icon} c-icon" style="color:${c.color}"></i>
            <span class="c-name">${c.name}</span>
            <span class="c-tag">${k}</span>
        `;
        btn.onclick = () => selectChain(k);
        g.appendChild(btn);
    });
}

function selectChain(k) {
    activeChain = k;
    document.querySelectorAll(".chain-btn").forEach(b => b.classList.remove("active"));
    const btn = document.getElementById(`cbtn-${k}`);
    if (btn) btn.classList.add("active");
    analyzeInput();
}

/* ═══════════════════════════════════════════
   INPUT ANALYSIS
═══════════════════════════════════════════ */
function analyzeInput() {
    const v = document.getElementById("wallet-input").value.trim();
    const lbl = document.getElementById("ident-label");
    if (!v) { lbl.textContent = "等待輸入…"; lbl.style.color = ""; return; }

    if (v.startsWith("T") && v.length === 34)
        return set(lbl, "TRON 錢包地址", "#ec0928");
    if ((v.startsWith("bc1") || v.startsWith("1") || v.startsWith("3")) && v.length >= 26)
        return set(lbl, "Bitcoin 錢包地址", "#f7931a");
    if (v.startsWith("0x")) {
        if (v.length === 42) return set(lbl, `EVM 錢包地址  [${activeChain}]`, "#3d9eff");
        if (v.length === 66) return set(lbl, "EVM 交易哈希 TxHash", "#3d9eff");
        return set(lbl, "0x 數據流（格式待確認）", "#5a7294");
    }
    if (/^[0-9a-fA-F]{64}$/.test(v))
        return set(lbl, "原始交易哈希（無 0x 前綴）", "#3d9eff");
    set(lbl, "通用查詢模式", "#5a7294");
}
function set(el, text, color) { el.textContent = text; el.style.color = color; }

function isBTCTxid(v) {
    return /^[a-fA-F0-9]{64}$/.test(v);
}

/* ═══════════════════════════════════════════
   QUERY EXECUTION
═══════════════════════════════════════════ */
async function runQuery() {
    const raw = document.getElementById("wallet-input").value.trim();
    if (!raw) return;

    const btn = document.getElementById("exec-btn");
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 查詢中…';

    openTerm(`${activeChain} // RPC TERMINAL`);
    termWrite(`<div class="t-line t-dim">[INIT] 連通 ${activeChain} 節點池…</div>`);

    try {
        const isHash = activeChain === "BTC" ? isBTCTxid(raw) : (raw.length === 66 || raw.length === 64);
        const chain = CHAINS[activeChain];

        if (chain.type === "evm") {
            await queryEVM(raw, isHash);
        } else if (activeChain === "BTC") {
            await queryBTC(raw, isHash);
        } else if (activeChain === "TRON") {
            await queryTRON(raw, isHash);
        }
    } catch (e) {
        termWrite(`<div class="t-line t-err">[EXCEPTION] ${e.message}</div>`);
    }

    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-bolt"></i> 查詢';
}

/* ─── EVM ─── */
async function queryEVM(query, isHash) {
    const chain = CHAINS[activeChain];
    if (isHash) {
        termWrite(`<div class="t-line t-dim">[RPC] eth_getTransactionByHash…</div>`);
        const [rTx, rReceipt] = await Promise.all([
            rpc(activeChain, { jsonrpc:"2.0", method:"eth_getTransactionByHash", params:[query], id:1 }),
            rpc(activeChain, { jsonrpc:"2.0", method:"eth_getTransactionReceipt", params:[query], id:2 }),
        ]);
        if (!rTx.ok || !rTx.data.result) {
            return termWrite(`<div class="t-line t-err">[MISS] 未找到該交易，可能尚未廣播至 ${activeChain}。</div>`);
        }
        const tx = rTx.data.result;
        const receipt = rReceipt.ok && rReceipt.data.result ? rReceipt.data.result : null;
        const status = receipt ? (receipt.status === "0x1" ? "✓ SUCCESS" : "✗ FAILED") : "PENDING";
        const gasUsed = receipt ? parseInt(receipt.gasUsed, 16).toLocaleString() : "—";
        const blockNum = tx.blockNumber ? parseInt(tx.blockNumber, 16).toLocaleString() : "Pending";
        const valueEth = new BigNumber(tx.value).div(1e18).toFixed(6);
        const gasPriceGwei = tx.gasPrice ? new BigNumber(tx.gasPrice, 16).div(1e9).toFixed(2) : "0";

        termWrite(`
<div class="t-line t-ok">[OK] ${activeChain} 交易解析完成</div>
<hr class="t-sep">
<div class="t-line">  TXHASH  <span class="t-hi">${query}</span></div>
<div class="t-line">  STATUS  <span class="${status.startsWith("✓") ? "t-ok" : "t-err"}">${status}</span></div>
<div class="t-line">  BLOCK   ${blockNum}</div>
<div class="t-line">  FROM    <span class="t-warn">${tx.from}</span></div>
<div class="t-line">  TO      <span class="t-warn">${tx.to || "(contract deploy)"}</span></div>
<div class="t-line">  VALUE   <span class="t-ok">${valueEth} ${chain.native}</span></div>
<div class="t-line">  GAS     ${gasUsed} used  ·  ${gasPriceGwei} Gwei</div>
`);
    } else {
        termWrite(`<div class="t-line t-dim">[RPC] eth_getBalance…</div>`);
        const rBal = await rpc(activeChain, { jsonrpc:"2.0", method:"eth_getBalance", params:[query,"latest"], id:3 });
        const native = rBal.ok && rBal.data.result
            ? new BigNumber(rBal.data.result).div(1e18).toFixed(6)
            : "0.000000";

        let html = `
<div class="t-line t-ok">[OK] ${activeChain} 賬戶資產解構完成</div>
<hr class="t-sep">
<div class="t-line">  ADDR  <span class="t-hi">${query}</span></div>
<div class="t-line">  <span class="t-warn">${chain.native.padEnd(6)}</span>  <span class="t-ok">${native}</span></div>
`;
        const tokens = TOKENS[activeChain] || [];
        for (const tok of tokens) {
            const pad = query.replace("0x","").toLowerCase().padStart(64,"0");
            const r = await rpc(activeChain, {
                jsonrpc:"2.0", method:"eth_call",
                params:[{ to: tok.addr, data: "0x70a08231" + pad }, "latest"], id:4
            });
            if (r.ok && r.data.result && r.data.result !== "0x") {
                const bal = new BigNumber(r.data.result, 16).div(new BigNumber(10).pow(tok.dec)).toFixed(4);
                html += `<div class="t-line">  <span class="t-warn">${tok.sym.padEnd(6)}</span>  <span class="t-ok">${bal}</span></div>`;
            }
        }
        termWrite(html);
    }
}

/* ─── BTC ─── */
async function queryBTC(query, isHash) {
    termWrite(`<div class="t-line t-dim">[BTC] Multi-Source Decode Engine...</div>`);

    async function getJSON(url) {
        try {
            const r = await fetch(url);
            if (r.ok) return await r.json();
        } catch(e) {}
        return null;
    }

    if (!isHash) {
        let d =
            await getJSON(`https://blockstream.info/api/address/${query}`) ||
            await getJSON(`https://mempool.space/api/address/${query}`);

        if (!d) {
            return termWrite(`<div class="t-line t-err">[FAIL] BTC 地址解析失敗，地址不存在或節點拒絕響應。</div>`);
        }

        const funded =
            (d.chain_stats?.funded_txo_sum || 0) +
            (d.mempool_stats?.funded_txo_sum || 0);

        const spent =
            (d.chain_stats?.spent_txo_sum || 0) +
            (d.mempool_stats?.spent_txo_sum || 0);

        const txCount =
            (d.chain_stats?.tx_count || 0) +
            (d.mempool_stats?.tx_count || 0);

        const balance = (funded - spent) / 1e8;

        termWrite(`
<div class="t-line t-ok">[OK] Bitcoin 地址解構完成</div>
<hr class="t-sep">
<div class="t-line"> ADDR     <span class="t-hi">${query}</span></div>
<div class="t-line"> BALANCE  <span class="t-ok">${balance.toFixed(8)} BTC</span></div>
<div class="t-line"> TXCOUNT  ${txCount}</div>
<div class="t-line"> FUNDED   ${(funded/1e8).toFixed(8)} BTC</div>
<div class="t-line"> SPENT    ${(spent/1e8).toFixed(8)} BTC</div>
`);
    } else {
        let d =
            await getJSON(`https://blockstream.info/api/tx/${query}`) ||
            await getJSON(`https://mempool.space/api/tx/${query}`);

        if (!d) {
            return termWrite(`<div class="t-line t-err">[MISS] 找不到 BTC 交易。</div>`);
        }

        let totalIn = 0;
        let totalOut = 0;

        (d.vin || []).forEach(v => {
            if (v.prevout?.value) totalIn += v.prevout.value;
        });

        (d.vout || []).forEach(v => {
            if (v.value) totalOut += v.value;
        });

        const fee = d.fee || 0;
        const confirmed = d.status?.confirmed || false;

        termWrite(`
<div class="t-line t-ok">[OK] Bitcoin 交易解構完成</div>
<hr class="t-sep">
<div class="t-line"> TXID     <span class="t-hi">${d.txid}</span></div>
<div class="t-line"> STATUS   <span class="${confirmed ? "t-ok" : "t-warn"}">${confirmed ? "CONFIRMED" : "MEMPOOL"}</span></div>
<div class="t-line"> BLOCK    ${d.status?.block_height || "未確認"}</div>
<div class="t-line"> INPUT    ${(totalIn/1e8).toFixed(8)} BTC</div>
<div class="t-line"> OUTPUT   ${(totalOut/1e8).toFixed(8)} BTC</div>
<div class="t-line"> FEE      ${(fee/1e8).toFixed(8)} BTC</div>
<div class="t-line"> VIN      ${(d.vin||[]).length}</div>
<div class="t-line"> VOUT     ${(d.vout||[]).length}</div>
`);
    }
}

/* ─── TRON ─── */
function tronHex(addr) {
    try {
        const AB = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
        let n = new BigNumber(0);
        for (const c of addr) n = n.multipliedBy(58).plus(AB.indexOf(c));
        let hex = n.toString(16);
        if (hex.length % 2) hex = "0" + hex;
        return hex.substring(2, 42).padStart(64, "0");
    } catch { return "0".repeat(64); }
}

async function queryTRON(query, isHash) {
    if (isHash) {
        termWrite(`<div class="t-line t-dim">[API] trongrid.io / gettransactionbyid…</div>`);
        const r = await fetch("https://api.trongrid.io/wallet/gettransactionbyid", {
            method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({ value: query })
        });
        if (!r.ok) return termWrite(`<div class="t-line t-err">[FAIL] TRON 網關無響應。</div>`);
        const d = await r.json();
        if (!d || !d.txID)
            return termWrite(`<div class="t-line t-err">[MISS] 未找到該交易哈希。</div>`);
        const ok = d.ret && d.ret[0].contractRet === "SUCCESS";
        termWrite(`
<div class="t-line t-ok">[OK] TRON 交易解析完成</div>
<hr class="t-sep">
<div class="t-line">  TXID    <span class="t-hi">${d.txID}</span></div>
<div class="t-line">  STATUS  <span class="${ok?"t-ok":"t-err"}">${ok ? "✓ SUCCESS" : "✗ FAILED"}</span></div>
<div class="t-line">  TYPE    ${d.raw_data.contract[0].type}</div>
`);
    } else {
        termWrite(`<div class="t-line t-dim">[API] trongrid.io / getaccount…</div>`);
        const hexParam = tronHex(query);
        const [rAcc, rUsdt, rRes] = await Promise.all([
            fetch("https://api.trongrid.io/wallet/getaccount", {
                method:"POST", headers:{"Content-Type":"application/json"},
                body: JSON.stringify({ address:query, visible:true })
            }),
            fetch("https://api.trongrid.io/wallet/triggerconstantcontract", {
                method:"POST", headers:{"Content-Type":"application/json"},
                body: JSON.stringify({
                    owner_address: query,
                    contract_address: "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t",
                    function_selector: "balanceOf(address)",
                    parameter: hexParam,
                    visible: true
                })
            }),
            fetch("https://api.trongrid.io/wallet/getaccountresource", {
                method:"POST", headers:{"Content-Type":"application/json"},
                body: JSON.stringify({ address:query, visible:true })
            }),
        ]);

        let html = `
<div class="t-line t-ok">[OK] TRON 賬戶資產解構完成</div>
<hr class="t-sep">
<div class="t-line">  ADDR  <span class="t-hi">${query}</span></div>
`;
        if (rAcc.ok) {
            const acc = await rAcc.json();
            const trx = acc.balance ? (acc.balance / 1e6).toFixed(4) : "0.0000";
            html += `<div class="t-line">  <span class="t-warn">TRX   </span>  <span class="t-ok">${trx}</span></div>`;
        }
        if (rUsdt.ok) {
            const ud = await rUsdt.json();
            if (ud && ud.constant_result && ud.constant_result[0]) {
                const ubal = new BigNumber(ud.constant_result[0], 16).div(1e6).toFixed(4);
                html += `<div class="t-line">  <span class="t-warn">USDT  </span>  <span class="t-ok">${ubal}</span></div>`;
            } else {
                html += `<div class="t-line">  <span class="t-warn">USDT  </span>  <span class="t-ok">0.0000</span></div>`;
            }
        }
        if (rRes.ok) {
            const rd = await rRes.json();
            const netFree  = (rd.FreeNetLimit||600)  - (rd.FreeNetUsed||0);
            const energyFree = (rd.EnergyLimit||0)   - (rd.EnergyUsed||0);
            html += `
<hr class="t-sep">
<div class="t-line t-dim">  資源池狀態</div>
<div class="t-line">  帶寬餘量   <span class="t-hi">${netFree.toLocaleString()}</span>  / ${(rd.FreeNetLimit||600)}</div>
<div class="t-line">  可用能量   <span class="t-hi">${energyFree.toLocaleString()}</span>  / ${(rd.EnergyLimit||0)}</div>
<div class="t-line t-dim">  ⓘ 能量為 0 時，TRC-20 轉帳將燒毀 <span class="t-warn">~32–65 TRX</span> 手續費</div>
`;
        }
        termWrite(html);
    }
}

/* ═══════════════════════════════════════════
   NETWORK MONITOR
═══════════════════════════════════════════ */
async function refreshAll() {
    if (refreshBusy) return;
    refreshBusy = true;
    await Promise.allSettled(Object.keys(CHAINS).map(k => refreshChain(k)));
    refreshBusy = false;
}

async function refreshChain(k) {
    const blkEl  = document.getElementById(`blk-${k}`);
    const gasEl  = document.getElementById(`gas-${k}`);
    const dotEl  = document.getElementById(`dot-${k}`);
    if (!blkEl) return;

    try {
        if (CHAINS[k].type === "btc") {
            let height = null;
            for (const src of ["https://blockstream.info/api/blocks/tip/height","https://mempool.space/api/blocks/tip/height"]) {
                try {
                    const r = await fetch(src);
                    if (r.ok) { const t = await r.text(); if (!isNaN(t)) { height = parseInt(t); break; } }
                } catch {}
            }
            if (height) {
                blkEl.textContent = height.toLocaleString();
                blkEl.classList.remove("loading");
                dotEl.className = "dot";
            } else { dotEl.className = "dot err"; }

            try {
                const r = await fetch("https://blockstream.info/api/fee-estimates");
                if (r.ok) { const d = await r.json(); if (d["2"]) gasEl.textContent = `${Math.round(d["2"])} sat/vB`; }
            } catch {}

        } else if (CHAINS[k].type === "evm") {
            const [rBlk, rGas] = await Promise.all([
                rpc(k, { jsonrpc:"2.0", method:"eth_blockNumber", params:[], id:5 }),
                rpc(k, { jsonrpc:"2.0", method:"eth_gasPrice",    params:[], id:6 }),
            ]);
            if (rBlk.ok && rBlk.data.result) {
                blkEl.textContent = parseInt(rBlk.data.result, 16).toLocaleString();
                blkEl.classList.remove("loading");
                dotEl.className = "dot";
            } else { dotEl.className = "dot err"; }
            if (rGas.ok && rGas.data.result) {
                gasEl.textContent = `${new BigNumber(rGas.data.result, 16).div(1e9).toFixed(2)} Gwei`;
            }

        } else if (CHAINS[k].type === "tron") {
            const r = await fetch("https://api.trongrid.io/wallet/getnowblock", { method:"POST" });
            if (r.ok) {
                const d = await r.json();
                if (d && d.block_header) {
                    blkEl.textContent = d.block_header.raw_data.number.toLocaleString();
                    blkEl.classList.remove("loading");
                    dotEl.className = "dot";
                }
            } else { dotEl.className = "dot err"; }
            try {
                const r2 = await fetch("https://api.trongrid.io/wallet/getchainparameters", { method:"POST" });
                if (r2.ok) {
                    const p = await r2.json();
                    const ef = p.chainParameter.find(x => x.key === "getEnergyFee");
                    if (ef) gasEl.textContent = `${ef.value} sun`;
                }
            } catch {}
        }
    } catch { dotEl.className = "dot err"; }
}

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
async function rpc(chain, payload, suffix = "", method = "POST") {
    for (const node of RPC[chain]) {
        try {
            const opts = { method, headers:{ "Content-Type":"application/json" } };
            if (method === "POST" && payload) opts.body = JSON.stringify(payload);
            const r = await fetch(node.url + suffix, opts);
            if (r.ok) return { ok: true, data: await r.json() };
        } catch {}
    }
    return { ok: false };
}

function openTerm(label) {
    document.getElementById("term-label").textContent = label;
    document.getElementById("term-body").innerHTML = "";
    document.getElementById("term").classList.add("active");
}
function closeTerm() { document.getElementById("term").classList.remove("active"); }
function termWrite(html) {
    const body = document.getElementById("term-body");
    body.innerHTML += html;
    body.scrollTop = body.scrollHeight;
}
