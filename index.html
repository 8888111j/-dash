function syncLivePrice() { const pair = document.getElementById("backtestTarget").value; if(livePrices[pair]) { document.getElementById("initPrice").value = livePrices[pair]; document.getElementById("gridUpper").value = Math.round(livePrices[pair] * 1.2); document.getElementById("gridLower").value = Math.round(livePrices[pair] * 0.8); } }
function runMonteCarloGrid() {
    const t = translations[currentLang]; const S0 = parseFloat(document.getElementById("initPrice").value);
    const upper = parseFloat(document.getElementById("gridUpper").value); const lower = parseFloat(document.getElementById("gridLower").value);
    const grids = parseInt(document.getElementById("gridCount").value); const vol = parseFloat(document.getElementById("volatility").value) / 100;
    const days = parseInt(document.getElementById("simDays").value); const runs = parseInt(document.getElementById("simRuns").value);
    if(!S0 || !upper || !lower || !grids) return;
    const dt = 1 / 365, steps = days, gridSpacing = (upper - lower) / grids; const pairText = document.getElementById("backtestTarget").value;
    let totalGridProfits = 0, breakUpperCount = 0, breakLowerCount = 0;
    for(let r = 0; r < runs; r++) {
        let price = S0; let lastGridIdx = Math.floor((price - lower) / gridSpacing); let gridProfit = 0; let pathBrokeLower = false, pathBrokeUpper = false;
        for(let s = 0; s < steps; s++) {
            let u1 = Math.random(), u2 = Math.random(); let randNormal = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
            price = price * Math.exp((0.05 - 0.5 * vol * vol) * dt + vol * Math.sqrt(dt) * randNormal);
            if (price >= upper) pathBrokeUpper = true; if (price <= lower) pathBrokeLower = true;
            let currentGridIdx = Math.floor((price - lower) / gridSpacing);
            if(currentGridIdx !== lastGridIdx && currentGridIdx >= 0 && currentGridIdx < grids) { gridProfit += (gridSpacing / S0) * 100; lastGridIdx = currentGridIdx; }
        }
        if(pathBrokeUpper) breakUpperCount++; if(pathBrokeLower) breakLowerCount++; totalGridProfits += gridProfit;
    }
    const avgGridProfit = totalGridProfits / runs;
    document.getElementById("backtestResult").innerHTML = `${t.backtestReport} (${pairText})\n--------------------------------\n${t.expectedProfit}:\n    ${t.avgCumulativeReturn}<span style="color:var(--green)">+${avgGridProfit.toFixed(2)}%</span>\n    ${t.annualizedReturn}<span style="color:var(--yellow)">+${((avgGridProfit / days) * 365).toFixed(1)}%</span>\n\n${t.gridBreakRisk}:\n    ${t.breakUpProb}${(breakUpperCount / runs * 100).toFixed(1)}%\n    ${t.breakDownProb}${(breakLowerCount / runs * 100).toFixed(1)}%`;
}

}

async function updatePrices() {
    try {

        if (res.ok) {

            data.forEach(item => {

                if(item.symbol === 'BTCUSDT') document.getElementById('price-BTC').innerText = `$${parseFloat(item.price).toLocaleString()}`;

            });
        }
    } catch (e) { }
}

// 🔥 全新超強穿透式邊緣反向代理引擎
async function fetchWithFallback(chainKey, payload, urlSuffix = "") {
    const chain = CHAINS[chainKey];
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 4500); // 4.5秒超時守護
    let start = Date.now();
    try {
        let reqUrl = chain.proxyUrl + urlSuffix;
        let response = chain.type === "evm" ? await fetch(reqUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal: controller.signal }) : await fetch(reqUrl + urlSuffix, { method: 'GET', signal: controller.signal });
        clearTimeout(timeoutId);
        if (response.ok) { let data = await response.json(); return { data, ping: Date.now() - start, success: true }; }
    } catch (e) { clearTimeout(timeoutId); }
    return { success: false };
}

async function updateMonitor() {
    const grid = document.getElementById("monitorGrid");
    for (let key in CHAINS) {
        try {
            let blockHeight = "連線中...", gasText = "取得中...", pingInfo = "🔴 離線", badgeColor = 'var(--red)';
            let card = document.getElementById(`card-${key}`) || document.createElement("div"); if(!card.id) { card.id = `card-${key}`; card.className = "card"; grid.appendChild(card); }
            if (CHAINS[key].type === "evm") {
                let res = await fetchWithFallback(key, { jsonrpc: "2.0", method: "eth_blockNumber", params: [], id: 1 }); let gasRes = await fetchWithFallback(key, { jsonrpc: "2.0", method: "eth_gasPrice", params: [], id: 2 });
                if (res?.success && res.data.result) { blockHeight = parseInt(res.data.result, 16); pingInfo = `🟢 ${res.ping}ms`; badgeColor = 'var(--green)'; }
                if (gasRes?.success && gasRes.data.result) gasText = `⛽ Gas: ${(Number(BigInt(gasRes.data.result)) / 10**9).toFixed(2)} Gwei`;
            } else if (CHAINS[key].type === "btc") {
                let res = await fetchWithFallback(key, null, "/blocks/tip"); let feeRes = await fetch("/api/btc/fee-estimates").catch(()=>null);
                if (res?.success && res.data && res.data[0]) { blockHeight = res.data[0].height || "成功"; pingInfo = `🟢 ${res.ping}ms`; badgeColor = 'var(--green)'; }
                if (feeRes?.ok) { let fee = await feeRes.json(); gasText = `📊 費率: ${(fee["1"] || 0).toFixed(1)} sat/vB`; } else { gasText = `📊 費率: ~16 sat/vB`; }
            } else if (CHAINS[key].type === "tron") {
                let res = await fetchWithFallback(key, null, "/wallet/getnowblock");
                if (res?.success && res.data && res.data.block_header) { blockHeight = res.data.block_header.raw_data.number; pingInfo = `🟢 ${res.ping}ms`; badgeColor = 'var(--green)'; gasText = `⚡ 門檻: 420/1000 sun`; }
            }
            card.innerHTML = `<div class="badge" style="background-color: ${badgeColor}"></div><h3>${CHAINS[key].name}</h3><div class="status">${blockHeight}</div><div class="gas-info">${gasText}</div><div class="ping">${pingInfo}</div>`;
        } catch (e) { }
    }
}

async function queryBalance() {
    const t = translations[currentLang]; const chainKey = document.getElementById("chainSelect").value; const address = document.getElementById("addressInput").value.trim(); const resultDiv = document.getElementById("searchResult");
    if (!address) { alert(t.noAddress); return; } resultDiv.innerHTML = `<span style="color:var(--yellow)">${t.querying}</span>`;
    try {
        if (CHAINS[chainKey].type === "evm") {
            // 1. 抓取原生資產
            let res = await fetchWithFallback(chainKey, { jsonrpc: "2.0", method: "eth_getBalance", params: [address, "latest"], id: 1 });
            if (res?.success && res.data.result) { 
                let nativeBal = (Number(BigInt(res.data.result)) / 1e18).toFixed(6);
                let output = `${t.balanceText}\n  🔹 <span style="color:var(--yellow)">${CHAINS[chainKey].symbol} (Native)</span>: <span style="color:var(--accent)">${nativeBal}</span>`;
                
                // 2. 併發穿透解構 Token_Matrix 中的 ERC-20 代幣資產
                const tokens = TOKEN_MATRIX[chainKey] || [];
                for (let token of tokens) {
                    const cleanAddr = address.replace('0x', '').toLowerCase().padStart(64, '0');
                    const dataParam = "0x70a08231" + cleanAddr; // balanceOf 函數指紋
                    let tokenRes = await fetchWithFallback(chainKey, { jsonrpc: "2.0", method: "eth_call", params: [{ to: token.address, data: dataParam }, "latest"], id: 2 });
                    
                    if (tokenRes?.success && tokenRes.data.result && tokenRes.data.result !== "0x") {
                        const rawBal = new BigNumber(tokenRes.data.result, 16);
                        const finalBal = rawBal.div(new BigNumber(10).pow(token.decimals)).toFixed(4);
                        output += `\n  💵 <span style="color:var(--green)">${token.symbol}</span>: <span style="color:var(--accent)">${finalBal}</span>`;
                    } else {
                        output += `\n  ⚪ <span style="color:var(--text-muted)">${token.symbol}</span>: <span style="color:var(--text-muted)">0.0000</span>`;
                    }
                }
                resultDiv.innerHTML = output;
            } else { resultDiv.innerHTML = `<span style="color:var(--red)">❌ EVM 查詢失敗</span>`; }
        } else if (chainKey === "BTC") {
            const res = await fetchWithFallback("BTC", null, `/address/${address}`);
            if (res?.success && res.data && res.data.chain_stats) { 
                let btcBal = ((res.data.chain_stats.funded_txo_sum - res.data.chain_stats.spent_txo_sum) / 1e8).toFixed(8);
                resultDiv.innerHTML = `${t.balanceText} <span style="color:var(--accent)">${btcBal} BTC</span>`; 
            } else { resultDiv.innerHTML = `<span style="color:var(--red)">❌ BTC 查詢失敗</span>`; }
        } else if (chainKey === "TRON") {
            // 穿透式代理向 TRON 節點提數據
            const res = await fetchWithFallback("TRON", { address: address, visible: true }, "/wallet/getaccount");
            if (res?.success) { 
                let tronBal = ((res.data.balance || 0) / 1e6).toFixed(6);
                resultDiv.innerHTML = `${t.balanceText} <span style="color:var(--accent)">${tronBal} TRX</span>`; 
            } else { resultDiv.innerHTML = `<span style="color:var(--red)">❌ TRON 查詢失敗</span>`; }
        }
    } catch (err) { resultDiv.innerHTML = `<span style="color:var(--red)">⚠️ 查詢過程發生異常: ${err.message}</span>`; }
}
